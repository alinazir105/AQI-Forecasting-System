name: Hourly AQI Collection

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger data collection on Railway
        run: |
          curl -X POST \
            "https://aqi-forecasting-system-production.up.railway.app/collect?api_key=${{ secrets.COLLECT_SECRET }}"

      - name: Download latest history CSV from Railway
        run: |
          curl -s \
            "https://aqi-forecasting-system-production.up.railway.app/download-history?api_key=${{ secrets.COLLECT_SECRET }}" \
            -o data/api_history.csv

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api_history.csv
          git diff --staged --quiet || git commit -m "Auto-sync api_history.csv [skip ci]"
          git push