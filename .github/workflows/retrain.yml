name: Daily Model Retraining

on:
  schedule:
    - cron: '0 2 * * *'  # runs at 2am UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger retraining on Railway
        run: |
          curl -X POST \
            "https://aqi-forecasting-system-production.up.railway.app/retrain?api_key=${{ secrets.COLLECT_SECRET }}"

      - name: Download updated model files
        run: |
          curl -s \
            "https://aqi-forecasting-system-production.up.railway.app/download-history?api_key=${{ secrets.COLLECT_SECRET }}" \
            -o data/api_history.csv

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api_history.csv
          git diff --staged --quiet || git commit -m "Auto-sync after daily retrain [skip ci]"
          git push